# Compila y ejecuta las pruebas del backend en cada cambio.
#
# Las pruebas usan H2 en modo PostgreSQL, asi que no hace falta levantar una
# base de datos: `verify` basta y el job no necesita servicios.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

# Un push nuevo sobre la misma rama deja obsoleta la ejecucion anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          # Guarda ~/.m2 entre ejecuciones; sin esto cada build vuelve a
          # descargar todas las dependencias de Spring.
          cache: maven

      - name: Build and test
        run: ./mvnw -B --no-transfer-progress verify

      # Los informes de surefire son lo unico que dice que fallo cuando el log
      # queda cortado, y se pierden al terminar el job si no se suben.
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7
