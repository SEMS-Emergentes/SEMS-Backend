# Perfil de pruebas: base de datos en memoria, sin servicios externos.
#
# Sirve para arrancar el contexto de Spring completo sin Postgres, sin SMTP y
# sin Stripe, que es lo que necesita ApplicationContextTest.

spring.datasource.url=jdbc:h2:mem:semstest;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Nada de correos ni cobros reales durante las pruebas.
app.mail.enabled=false
stripe.secret-key=
stripe.webhook-secret=

security.jwt.secret=test_secret_key_with_at_least_32_characters_long
