spring.application.name=sems-backend
spring.config.import=optional:file:.env[.properties]

# ---------------------------------------------------------------- base de datos
# Un solo Postgres. Cada modulo aisla sus tablas por prefijo de nombre; el
# esquema se puede separar mas adelante sin tocar el codigo de dominio.
spring.datasource.url=${DATABASE_URL:${DB_URL:}}
spring.datasource.username=${DB_USERNAME:${DB_USER:}}
spring.datasource.password=${DB_PASSWORD:${DB_PASS:}}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.sql.init.mode=never

# ---------------------------------------------------------------------- servidor
server.port=${SERVER_PORT:${PORT:8080}}

# ------------------------------------------------------------------------- CORS
# Tres origenes: las dos aplicaciones desplegadas y el entorno de desarrollo.
# Si falta alguno, esa aplicacion falla con error de CORS y parece que el
# backend esta caido.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:${ALLOWED_ORIGINS:https://sems-web-application.vercel.app,https://sems-diseno-web.vercel.app,http://localhost:5173}}

# -------------------------------------------------------------------- seguridad
security.jwt.secret=${JWT_SECRET:replace_with_minimum_32_chars_secret_key_for_hs256}
security.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:120}
security.jwt.refresh-expiration-days=${JWT_REFRESH_EXPIRATION_DAYS:30}

app.security.auth-required=${AUTH_REQUIRED:true}
app.security.require-verification=${REQUIRE_VERIFICATION:false}

security.oauth2.google.client-id=${GOOGLE_CLIENT_ID:}
security.oauth2.google.client-secret=${GOOGLE_CLIENT_SECRET:}
security.oauth2.google.redirect-uri=${GOOGLE_REDIRECT_URI:}
security.oauth2.google.scopes=${GOOGLE_SCOPES:openid,email,profile}

# URL publica del frontend, usada en los enlaces de verificacion y recuperacion
service.public-base-url=${APP_BASE_URL:${FRONTEND_URL:https://sems-web-application.vercel.app}}

# ----------------------------------------------------------------------- correo
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}
app.mail.enabled=${MAIL_ENABLED:true}

# ------------------------------------------------------------------------ pagos
stripe.secret-key=${STRIPE_SECRET_KEY:}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
stripe.currency=${STRIPE_CURRENCY:pen}
# Identificadores de precio en Stripe, usados por el cargador de planes
stripe.price.free=${STRIPE_PRICE_FREE:}
stripe.price.plus=${STRIPE_PRICE_PLUS:}
stripe.price.pro=${STRIPE_PRICE_PRO:}

# ---------------------------------------------------------------- observabilidad
# /actuator/health para el health check del proveedor de hosting.
# /actuator/prometheus para el monitoreo continuo del Cap. VII.
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when-authorized
management.metrics.tags.application=${spring.application.name}

# El indicador de correo queda apagado a proposito.
#
# Al haber spring-boot-starter-mail en el classpath, Spring anade un indicador
# que abre una conexion con el servidor SMTP cada vez que se consulta
# /actuator/health. En el hosting esa conexion falla y el health check devuelve
# 503 con la aplicacion perfectamente sana. El proveedor lo lee como proceso
# caido y reinicia el contenedor una y otra vez.
#
# Que se pueda mandar correo o no lo decide app.mail.enabled, no esto.
management.health.mail.enabled=false

# -------------------------------------------------------------- documentacion
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.operationsSorter=method

# ----------------------------------------------------------------------- logging
logging.level.root=INFO
logging.level.com.sems=INFO
